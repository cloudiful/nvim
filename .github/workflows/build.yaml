name: Build Neovim Config

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64-musl
            runner: ubuntu-latest
          - target: linux-aarch64-musl
            runner: ubuntu-latest
          - target: macos-arm64
            runner: macos-14
          - target: windows-x86_64
            runner: windows-2022

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Sync Python project
        run: uv sync --locked

      - name: Test Python build tool
        run: uv run --locked python -m unittest discover -s tests -v

      - name: Install Linux tools
        if: startsWith(matrix.target, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git zstd

      - name: Install macOS tools
        if: matrix.target == 'macos-arm64'
        run: brew install zstd

      - name: Install Windows tools
        if: matrix.target == 'windows-x86_64'
        shell: pwsh
        run: choco install zstandard --yes --no-progress

      - name: Install Neovim
        run: uv run --locked nvim-bundle install-nvim --version 0.12.4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tree-sitter CLI
        run: uv run --locked nvim-bundle install-tree-sitter --version 0.26.11

      - name: Check Neovim version
        run: >-
          nvim --headless -i NONE -u NONE
          '+lua assert(vim.version().major == 0 and vim.version().minor >= 12, "Neovim 0.12+ is required")'
          '+qa!'

      - name: Install Zig cross compiler
        if: startsWith(matrix.target, 'linux-')
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.1

      - name: Build bundle
        run: >-
          uv run --locked nvim-bundle package
          --target ${{ matrix.target }}
          --output-dir "$RUNNER_TEMP/nvim-config-output"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nvim-config-${{ matrix.target }}
          path: ${{ runner.temp }}/nvim-config-output/*.tar.zst
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*.tar.zst
